<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tangkap Buah - Deteksi Tangan</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:Arial,sans-serif;color:white}
#app{position:relative;width:100%;height:100%;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111}
#game{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;align-items:center;z-index:5}
.badge{background:rgba(0,0,0,.62);backdrop-filter:blur(5px);padding:9px 13px;border-radius:14px;font-weight:700}
#status{position:absolute;left:50%;top:62px;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:9px 15px;border-radius:16px;z-index:6;text-align:center;white-space:nowrap}
#startPanel{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,9,18,.82);padding:20px}
.card{max-width:560px;width:100%;background:#102039;border:1px solid #2b4668;border-radius:24px;padding:28px;text-align:center;box-shadow:0 20px 60px #0008}
h1{margin:0 0 10px;font-size:clamp(28px,5vw,48px)}
p{line-height:1.5;color:#d8e6f8}
button{border:0;border-radius:14px;padding:13px 20px;font-size:17px;font-weight:800;cursor:pointer;background:#2bd576;color:#062014;margin:5px}
button.secondary{background:#27415f;color:#fff}
#handDot{position:absolute;width:34px;height:34px;border-radius:50%;border:4px solid #fff;background:#00e676;box-shadow:0 0 0 8px rgba(0,230,118,.22),0 0 25px #00e676;z-index:8;transform:translate(-50%,-50%);display:none;pointer-events:none}
#question{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);z-index:7;background:rgba(0,0,0,.72);border:2px solid rgba(255,255,255,.25);padding:14px 22px;border-radius:18px;text-align:center;font-size:clamp(20px,3vw,34px);font-weight:800;max-width:90%}
.fruit{position:absolute;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;background:rgba(255,255,255,.92);box-shadow:0 8px 22px #0008;border:4px solid white;z-index:4;user-select:none}
.fruit span{font-size:24px;font-weight:900;color:#172033;text-shadow:none}
#hint{font-size:14px;color:#b9cae0;margin-top:12px}
@media(max-width:600px){.fruit{width:72px;height:72px;font-size:32px}.fruit span{font-size:19px}#question{bottom:12px}}
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted></video>
  <canvas id="game"></canvas>
  <div id="handDot"></div>

  <div id="hud">
    <div class="badge">🍎 Tangkap Buah</div>
    <div class="badge">Skor: <span id="score">0</span></div>
  </div>
  <div id="status">Menunggu kamera…</div>
  <div id="question">Tekan MULAI</div>

  <div id="startPanel">
    <div class="card">
      <h1>🍎 Tangkap Buah</h1>
      <p>Game matematika dengan <b>deteksi tangan</b>. Arahkan ujung jari telunjuk ke buah yang berisi jawaban benar.</p>
      <button id="startBtn">🎥 MULAI KAMERA</button>
      <button class="secondary" id="testBtn">🖐️ TES TANGAN</button>
      <div id="hint">Gunakan Chrome/Edge dan izinkan akses kamera. MediaPipe Hands dimuat dari CDN saat online.</div>
    </div>
  </div>
</div>

<script>
const VERSION = "0.4.1675469240";
const CDN_LIST = [
  "https://cdn.jsdelivr.net/npm/@mediapipe/hands@" + VERSION + "/hands.js",
  "https://unpkg.com/@mediapipe/hands@" + VERSION + "/hands.js"
];

const video = document.getElementById("video");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const dot = document.getElementById("handDot");
const statusEl = document.getElementById("status");
const startPanel = document.getElementById("startPanel");
const questionEl = document.getElementById("question");
const scoreEl = document.getElementById("score");

let hands = null;
let mediaStream = null;
let running = false;
let handReady = false;
let lastPoint = null;
let fruits = [];
let score = 0;
let currentQuestion = null;
let lastFrame = 0;
let lastSpawn = 0;
let testOnly = false;

const questions = [
  {q:"Berapakah 1/2 × 6?", a:"3", opts:["2","3","4"]},
  {q:"Berapakah 3/4 × 8?", a:"6", opts:["4","6","8"]},
  {q:"Berapakah 2/3 × 9?", a:"6", opts:["5","6","7"]},
  {q:"Berapakah 5/6 × 12?", a:"10", opts:["8","10","12"]},
  {q:"Berapakah 3/5 × 10?", a:"6", opts:["5","6","7"]},
  {q:"Berapakah 7/10 × 20?", a:"14", opts:["12","14","16"]},
  {q:"Berapakah 4/5 × 15?", a:"12", opts:["10","12","14"]},
  {q:"Berapakah 2/7 × 14?", a:"4", opts:["4","6","8"]}
];

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

function setStatus(t, ok=false){
  statusEl.textContent=t;
  statusEl.style.border = ok ? "1px solid #00e676" : "1px solid rgba(255,255,255,.18)";
}

async function loadHands(){
  if(window.Hands) return "cdn";
  for(const src of CDN_LIST){
    try{
      await new Promise((resolve,reject)=>{
        const s=document.createElement("script");
        s.src=src;
        s.crossOrigin="anonymous";
        s.onload=()=>resolve();
        s.onerror=()=>reject(new Error("gagal memuat "+src));
        document.head.appendChild(s);
      });
      if(window.Hands) return src.includes("unpkg") ? "unpkg" : "jsdelivr";
    }catch(e){}
  }
  throw new Error("Library MediaPipe Hands tidak dapat dimuat dari CDN.");
}

async function setupHands(){
  const source = await loadHands();
  const base = source==="unpkg"
    ? "https://unpkg.com/@mediapipe/hands@" + VERSION + "/"
    : "https://cdn.jsdelivr.net/npm/@mediapipe/hands@" + VERSION + "/";
  hands = new Hands({locateFile:file=>base+file});
  hands.setOptions({
    maxNumHands:1,
    modelComplexity:0,
    minDetectionConfidence:0.55,
    minTrackingConfidence:0.55
  });
  hands.onResults(onResults);
  handReady = true;
  setStatus("MediaPipe aktif — arahkan telunjuk ke kamera", true);
}

function onResults(results){
  if(!results.multiHandLandmarks || !results.multiHandLandmarks.length){
    dot.style.display="none";
    lastPoint=null;
    if(running && handReady) setStatus("Kamera aktif — tangan belum terdeteksi");
    return;
  }

  const lm = results.multiHandLandmarks[0];
  const finger = lm[8]; // ujung telunjuk
  const x = (1 - finger.x) * innerWidth; // karena video mirror
  const y = finger.y * innerHeight;

  // smoothing
  if(lastPoint){
    lastPoint.x += (x-lastPoint.x)*0.42;
    lastPoint.y += (y-lastPoint.y)*0.42;
  }else lastPoint={x,y};

  dot.style.display="block";
  dot.style.left=lastPoint.x+"px";
  dot.style.top=lastPoint.y+"px";
  setStatus("✋ Tangan terdeteksi", true);

  if(!testOnly && running) checkCatch(lastPoint.x,lastPoint.y);
}

async function cameraStart(){
  mediaStream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"user", width:{ideal:1280}, height:{ideal:720}},
    audio:false
  });
  video.srcObject=mediaStream;
  await video.play();
}

async function processingLoop(t){
  if(!running || !handReady) return;
  if(t-lastFrame>55 && video.readyState>=2){
    lastFrame=t;
    try{ await hands.send({image:video}); }catch(e){}
  }
  requestAnimationFrame(processingLoop);
}

function newQuestion(){
  currentQuestion = questions[Math.floor(Math.random()*questions.length)];
  questionEl.textContent = currentQuestion.q;
  fruits=[];
  const opts=[...currentQuestion.opts].sort(()=>Math.random()-.5);
  opts.forEach((ans,i)=>{
    fruits.push({
      x: innerWidth*(0.2+i*0.3),
      y: -100-i*55,
      vy: 1.2+Math.random()*1.0,
      answer:ans,
      emoji:["🍎","🍊","🍉"][i]
    });
  });
}

function spawnLoop(t){
  if(!running || testOnly) return;
  if(t-lastSpawn>6500){
    lastSpawn=t;
    newQuestion();
  }
  requestAnimationFrame(spawnLoop);
}

function checkCatch(x,y){
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    const dx=x-f.x, dy=y-f.y;
    if(dx*dx+dy*dy<55*55){
      const good = f.answer===currentQuestion.a;
      if(good){
        score++;
        scoreEl.textContent=score;
        questionEl.textContent="✅ Benar!";
      }else{
        score=Math.max(0,score-1);
        scoreEl.textContent=score;
        questionEl.textContent="❌ Coba lagi!";
      }
      fruits.splice(i,1);
      setTimeout(()=>{if(running)newQuestion()},450);
      break;
    }
  }
}

function draw(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    f.y += f.vy * (t-lastFrame||16)/16;
    ctx.font="70px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(f.emoji,f.x,f.y);
    ctx.font="bold 27px Arial";
    ctx.fillStyle="#ffffff";
    ctx.shadowColor="#000";
    ctx.shadowBlur=7;
    ctx.fillText(f.answer,f.x,f.y);
    ctx.shadowBlur=0;
    if(f.y>innerHeight+100) fruits.splice(i,1);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

async function start(test=false){
  try{
    testOnly=test;
    setStatus("Meminta izin kamera…");
    await cameraStart();
    setStatus("Kamera aktif — memuat deteksi tangan…");
    await setupHands();
    startPanel.style.display="none";
    running=true;
    score=0;
    scoreEl.textContent="0";
    if(!testOnly){
      newQuestion();
      lastSpawn=performance.now();
      requestAnimationFrame(spawnLoop);
    }else{
      questionEl.textContent="TES: gerakkan telunjuk di depan kamera";
    }
    requestAnimationFrame(processingLoop);
  }catch(err){
    console.error(err);
    setStatus("Gagal: "+err.message);
    document.getElementById("hint").innerHTML =
      "Jika kamera muncul tetapi tangan tidak terdeteksi, coba Chrome/Edge terbaru dan pastikan internet aktif. " +
      "Jika CDN pertama gagal, halaman otomatis mencoba CDN cadangan.";
  }
}

document.getElementById("startBtn").onclick=()=>start(false);
document.getElementById("testBtn").onclick=()=>start(true);
</script>
</body>
</html>
